[workspace]
members = [
    "crates/black-hole-shared",
    "crates/black-hole-engine",
    "crates/black-hole-platform",
    "crates/black-hole-ui",
    "crates/black-hole-daemon",
    "crates/icon-gen",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Black-Hole IME Team"]
license = "MIT"

[workspace.dependencies]
# Internal crates
black-hole-shared = { path = "crates/black-hole-shared" }
black-hole-engine = { path = "crates/black-hole-engine" }
black-hole-platform = { path = "crates/black-hole-platform" }
black-hole-ui = { path = "crates/black-hole-ui" }

# External crates
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
notify = "8"
thiserror = "2.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = { version = "0.62", features = ["Win32_Foundation"] }
winresource = "0.1"
