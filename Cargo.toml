[workspace]
members = [
    "crates/blackhole-shared",
    "crates/blackhole-engine",
    "crates/blackhole-platform",
    "crates/blackhole-ui",
    "crates/blackhole-daemon",
        "crates/icon-gen",
    ]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Blackhole IME Team"]
license = "MIT"

[workspace.dependencies]
# Internal crates
blackhole-shared = { path = "crates/blackhole-shared" }
blackhole-engine = { path = "crates/blackhole-engine" }
blackhole-platform = { path = "crates/blackhole-platform" }
blackhole-ui = { path = "crates/blackhole-ui" }

# External crates
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = { version = "0.62", features = ["Win32_Foundation"] }
