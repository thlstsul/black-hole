# ===========================================================================
# Blackhole IME - cargo-make 构建与打包任务
#
# 用法:
#   cargo make pack             # 自动检测平台并打包
#   cargo make prepare-staging  # 仅准备 staging 目录（不打包）
#   cargo make clean            # 清理
#
# 安装 cargo-make: cargo install cargo-make --locked
# 文档: https://sagiegurari.github.io/cargo-make/
# ===========================================================================

[config]
skip_core_tasks = true

[env]
PACKAGER_MANIFEST = "crates/blackhole-daemon/Cargo.toml"

# ===========================================================================
# 图标生成
# ===========================================================================

[tasks.generate-icons]
workspace = false
category = "Build"
description = "从 SVG 生成多尺寸 ICO 图标和 tray PNG"
condition = { platforms = ["windows"] }
command = "cargo"
args = ["run", "--release", "-p", "icon-gen"]

# ===========================================================================
# 构建（内部任务，通过 pack 间接调用）
# ===========================================================================

[tasks.build-daemon]
workspace = false
private = true
category = "Build"
description = "构建 daemon (release)"
command = "cargo"
args = ["build", "--release", "-p", "blackhole-daemon"]

[tasks.build-platform]
workspace = false
private = true
category = "Build"
description = "构建 platform 库 (release)"
command = "cargo"
args = ["build", "--release", "-p", "blackhole-platform"]

[tasks.build-all]
workspace = false
category = "Build"
description = "构建 daemon + platform"
dependencies = ["build-daemon", "build-platform"]

# ===========================================================================
# Staging 准备
# ===========================================================================

[tasks.prepare-staging]
workspace = false
category = "Publish"
description = "准备 staging 目录（自动检测平台）"
condition = { platforms = ["windows", "linux"] }
dependencies = ["prepare-staging-win", "prepare-staging-linux"]

[tasks.prepare-staging-win]
workspace = false
private = true
condition = { platforms = ["windows"] }
description = "准备 staging 目录 (Windows)"
dependencies = ["generate-icons", "build-daemon", "build-platform"]
script_runner = "powershell"
script_extension = "ps1"
script = '''
Remove-Item -Recurse -Force target\packaging\staging -ErrorAction SilentlyContinue
New-Item -ItemType Directory -Force -Path target\packaging\staging | Out-Null
Copy-Item target\release\blackhole.exe -Destination target\packaging\staging\ -Force
Write-Host "  [+] blackhole.exe"
Copy-Item target\release\blackhole_platform.dll -Destination target\packaging\staging\ -Force
Write-Host "  [+] blackhole_platform.dll"
if (Test-Path assets\dicts) { Copy-Item assets\dicts -Destination target\packaging\staging\dicts -Recurse -Force; Write-Host "  [+] dicts/" } else { Write-Host "  [WARN] 未找到词库目录 assets\dicts" }
Write-Host "[OK] staging: target\packaging\staging"
'''

[tasks.prepare-staging-linux]
workspace = false
private = true
condition = { platforms = ["linux"] }
description = "准备 staging 目录 (Linux)"
dependencies = ["build-daemon"]
script_runner = "@shell"
script = '''
#!/usr/bin/env bash
set -euo pipefail
rm -rf target/packaging/staging
mkdir -p target/packaging/staging
cp target/release/blackhole target/packaging/staging/blackhole
echo "  [+] blackhole"
if [ -d assets/dicts ]; then
    cp -r assets/dicts target/packaging/staging/dicts
    echo "  [+] dicts/"
else
    echo "  [WARN] 未找到词库目录"
fi
if [ -f assets/icons/blackhole.svg ]; then
    mkdir -p target/packaging/staging/icons
    cp assets/icons/blackhole.svg target/packaging/staging/icons/blackhole.svg
    echo "  [+] icons/blackhole.svg"
fi
if [ -f platforms/linux/blackhole.xml ]; then
    cp platforms/linux/blackhole.xml target/packaging/staging/blackhole.xml
    echo "  [+] blackhole.xml"
fi
echo "[OK] staging: target/packaging/staging"
'''

# ===========================================================================
# 打包
# ===========================================================================

[tasks.pack]
workspace = false
category = "Publish"
description = "打包（自动检测平台）"
condition = { platforms = ["windows", "linux"] }
dependencies = ["pack-win", "pack-linux"]

[tasks.pack-win]
workspace = false
private = true
condition = { platforms = ["windows"] }
description = "打包 Windows NSIS 安装包"
install_crate = { crate_name = "cargo-packager", args = ["--locked"] }
dependencies = ["prepare-staging"]
command = "cargo"
args = ["packager", "--manifest-path", "${PACKAGER_MANIFEST}", "--release", "--formats", "nsis"]

[tasks.pack-linux]
workspace = false
private = true
condition = { platforms = ["linux"] }
description = "打包 Linux deb + AppImage"
install_crate = { crate_name = "cargo-packager", args = ["--locked"] }
dependencies = ["prepare-staging"]
command = "cargo"
args = ["packager", "--manifest-path", "${PACKAGER_MANIFEST}", "--release", "--formats", "deb,appimage"]

# ===========================================================================
# 清理
# ===========================================================================

[tasks.clean]
workspace = false
category = "Build"
description = "清理构建产物和 staging 目录"
script_runner = "@duckscript"
script = '''
exec --fail-on-error cargo clean
rm -r target/packaging
'''
